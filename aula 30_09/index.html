<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .calculadora {
            background-color: #333;
            padding: 20px;
            border-radius: 15px;
            width: 300px;
        }

        #visor {
            width: 100%;
            height: 60px;
            font-size: 30px;
            text-align: right;
            margin-bottom: 15px;
            border: none;
            border-radius: 10px;
            padding: 0 10px;
            box-sizing: border-box;
        }

        .botoes {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        button {
            height: 60px;
            font-size: 22px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.8;
        }

        .operador {
            background-color: orange;
        }

        .igual {
            background-color: #28a745;
            color: white;
        }

        .limpar {
            background-color: #dc3545;
            color: white;
        }
    </style>
</head>

<body>

    <div class="calculadora">

        <input type="text" id="visor" value="0" disabled>

        <div class="botoes">

            <button onclick="adicionarNumero('7')">7</button>
            <button onclick="adicionarNumero('8')">8</button>
            <button onclick="adicionarNumero('9')">9</button>
            <button class="operador" onclick="adicionarOperador('/')">÷</button>

            <button onclick="adicionarNumero('4')">4</button>
            <button onclick="adicionarNumero('5')">5</button>
            <button onclick="adicionarNumero('6')">6</button>
            <button class="operador" onclick="adicionarOperador('*')">×</button>

            <button onclick="adicionarNumero('1')">1</button>
            <button onclick="adicionarNumero('2')">2</button>
            <button onclick="adicionarNumero('3')">3</button>
            <button class="operador" onclick="adicionarOperador('-')">−</button>

            <button onclick="adicionarNumero('0')">0</button>
            <button onclick="adicionarNumero('.')">.</button>
            <button class="igual" onclick="calcular()">=</button>
            <button class="operador" onclick="adicionarOperador('+')">+</button>

            <button class="limpar" onclick="limpar()" style="grid-column: span 4;">
                C
            </button>

        </div>
    </div>

    <script src="variaveis.js"></script>

</body>
</html>
